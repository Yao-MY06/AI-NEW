name: docker

# 推 main / 打 tag 时构建镜像并发布到 GHCR
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yao-my06/ai-new:latest
            ghcr.io/yao-my06/ai-new:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
